# Component: proof-engine. Re-derives a Proof Block with the model-free Afterlife engine, report-only: the proof stays in the
# job artifact and log. belay-apply (gitlab/apply) re-derives it from the same evidence and posts it (F4).
# Syntax checked 2026-10-06 against:
#   spec:inputs (type, default, options, regex, description) ... https://docs.gitlab.com/ci/yaml/#specinputs  [S]
#   $[[ inputs.x ]] interpolation, also in job names ............ https://docs.gitlab.com/ci/components/        [S]
#   id_tokens / rules:if / artifacts:reports / resource_group ... https://docs.gitlab.com/ci/yaml/           [S]
#   rules:variables (set AFTERLIFE_PHASE per matching rule) ....... https://docs.gitlab.com/ci/yaml/#rulesvariables [R]
#   CI_JOB_TOKEN cannot write MR notes or labels; it can git-clone another project that allowlists this one
#       .......................................................... https://docs.gitlab.com/ci/jobs/ci_job_token/ [S]
#   glab auth login --job-token, glab api ............................. https://docs.gitlab.com/cli/ [S]
# [R?] verify: arrays interpolated into `tags:` (runner_tags) and the glab release asset URL below.
spec:
  inputs:
    stage:
      default: test
      description: Run after the jobs that produce the evidence (their artifacts are passed on by stage order).
    class:
      type: string
      description: The proof class to derive (src/schemas/proof.ts). One include per class.
      options: [exploit-test, cited-diff, rerun-stats, repro, bench-delta, linked-evidence, score-delta, ledger-record]
    engine_ref:
      type: string
      regex: '^[A-Za-z0-9][A-Za-z0-9._/-]*$'
      description: Tag, branch or full SHA of the Afterlife engine to run. Required, so the checker is always pinned.
    engine_commit:
      default: ''
      regex: '^([0-9a-f]{40})?$'
      description: Optional 40-char SHA the checkout must resolve to. Set it when engine_ref is a tag or branch.
    engine_project:
      default: '$CI_PROJECT_NAMESPACE/belay-engine'
      regex: '^[A-Za-z0-9$_./-]+$'
      description: Project path holding the Afterlife repo (engine/, src/schemas, gitlab/). Must allowlist this project's job token.
    policy_project:
      default: '$CI_PROJECT_NAMESPACE/belay-policy'
      regex: '^[A-Za-z0-9$_./-]+$'
    policy_ref:
      default: main
      regex: '^[A-Za-z0-9][A-Za-z0-9._/-]*$'
    agent_prefix:
      default: 'ai-'
      regex: '^[A-Za-z0-9._-]*$'
      description: Only MRs from accounts with this prefix and a Belay-Task trailer are proven; others are skipped.
    evidence_mode:
      default: auto
      options: [auto, provided]
      description: auto builds the prove input with scripts/proof/build-evidence.mjs (exploit-test, cited-diff, rerun-stats). provided uses evidence_file as an earlier job or prepare_script wrote it.
    evidence_file:
      default: belay-evidence.json
      regex: '^[A-Za-z0-9][A-Za-z0-9._/-]*$'
      description: Only for evidence_mode provided. The `prove --input` file, relative to the project root.
    build_args:
      default: ''
      regex: '^[A-Za-z0-9 ._/:=@,+%-]*$'
      description: Extra arguments for build-evidence.mjs, e.g. for exploit-test "--base-junit base/junit.xml --head-junit head/junit.xml --base-ref URL --head-ref URL --rescan-base base/scan.json --rescan-head head/scan.json".
    block_authors:
      default: ''
      regex: '^[A-Za-z0-9$_., -]*$'
      description: Accounts whose belay-guardrail / belay-medic block counts. Empty means ai-guardrail-<group> or ai-medic-<group>. [R?] the exact ai-<flow>-<group> username form.
    prepare_script:
      default: ''
      description: Optional shell run before the evidence is built. Sees AFTERLIFE_MR_IID, AFTERLIFE_TASK_ID, AFTERLIFE_ACTION_CLASS, AFTERLIFE_AGENT, AFTERLIFE_BASE_SHA, AFTERLIFE_HEAD_SHA, AFTERLIFE_DIFF_FILE, AFTERLIFE_POLICY_FILE, AFTERLIFE_PHASE (and, for one deprecation window, each under its pre-rename name).
    post_merge:
      type: boolean
      default: false
      description: Also re-derive on the default branch after merge; a red result is the tripwire's post_merge_proof_fail. Turn it on only when the evidence jobs also run on the default branch, or the missing evidence reads as a failure and demotes the agent.
    node_image:
      default: 'node:22-bookworm'
      description: Needs git, curl and node 20+. The -slim image has no git.
    glab_version:
      default: '1.120.0'
      regex: '^[0-9]+\.[0-9]+\.[0-9]+$'
    glab_sha256:
      default: '4e6c59de9f7ed2f304bf93aad01ea8f8a69584f0450ce90ad696ef81f69c69aa'
      regex: '^[0-9a-f]{64}$'
      description: SHA-256 of the glab linux amd64 tarball for glab_version. The default is glab 1.120.0's checksum from its published checksums.txt. Set it for any other glab_version; an empty value fails the job rather than install an unverified binary.
    runner_tags:
      type: array
      default: []
---
# The belay- job names and the .belay* workspace dirs keep the pre-rename name: they are wire names (consumers extend the
# boot job, the poller and belay-apply read jobs and artifact paths back by name, and armed targets .gitignore the dirs).
.belay-boot-proof-engine:
  image: $[[ inputs.node_image ]]
  tags: $[[ inputs.runner_tags ]]
  variables:
    GIT_DEPTH: "0"
  cache:
    key: belay-engine-$[[ inputs.engine_ref ]]
    paths: [.belay-engine/node_modules/]
  before_script:
    - |
      set -eu
      # M6/F100: what picks the code run beside CI_JOB_TOKEN comes from the inputs, fixed at include time, never a job
      # variable: a pipeline variable (trigger, API, manual run) outranks the job's variables and would choose it instead.
      AFTERLIFE_ENGINE_PROJECT="$[[ inputs.engine_project ]]"; AFTERLIFE_ENGINE_REF='$[[ inputs.engine_ref ]]'
      AFTERLIFE_ENGINE_COMMIT='$[[ inputs.engine_commit ]]'; AFTERLIFE_GLAB_VERSION='$[[ inputs.glab_version ]]'
      AFTERLIFE_GLAB_SHA256='$[[ inputs.glab_sha256 ]]'; AFTERLIFE_POLICY_REF='$[[ inputs.policy_ref ]]'
      AFTERLIFE_POLICY_PROJECT="$[[ inputs.policy_project ]]"; export AFTERLIFE_POLICY_PROJECT AFTERLIFE_POLICY_REF
      HOSTURL="https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_FQDN}"
      export AFTERLIFE_DIR="$CI_PROJECT_DIR/.belay-engine"
      export AFTERLIFE_GLUE="$AFTERLIFE_DIR/gitlab/components/scripts"
      # Each export under its pre-rename name too, for one deprecation window: an engine_ref pinned before the rename reads those.
      export BELAY_POLICY_PROJECT="$AFTERLIFE_POLICY_PROJECT" BELAY_POLICY_REF="$AFTERLIFE_POLICY_REF"
      export BELAY_DIR="$AFTERLIFE_DIR" BELAY_GLUE="$AFTERLIFE_GLUE"
      git init -q "$AFTERLIFE_DIR"
      git -C "$AFTERLIFE_DIR" fetch -q --depth 1 "$HOSTURL/${AFTERLIFE_ENGINE_PROJECT}.git" "$AFTERLIFE_ENGINE_REF"
      git -C "$AFTERLIFE_DIR" checkout -q FETCH_HEAD
      if [ -n "$AFTERLIFE_ENGINE_COMMIT" ] && [ "$(git -C "$AFTERLIFE_DIR" rev-parse HEAD)" != "$AFTERLIFE_ENGINE_COMMIT" ]; then
        echo "the Afterlife engine is at $(git -C "$AFTERLIFE_DIR" rev-parse HEAD), not the pinned $AFTERLIFE_ENGINE_COMMIT" >&2; exit 2
      fi
      (cd "$AFTERLIFE_DIR" && npm ci --ignore-scripts --no-audit --no-fund --loglevel=error)
      if ! command -v glab >/dev/null 2>&1; then
        V="$AFTERLIFE_GLAB_VERSION"; T="$(mktemp -d)"
        if [ -z "$AFTERLIFE_GLAB_SHA256" ]; then echo "glab $V has no glab_sha256: refusing to install it unverified" >&2; exit 2; fi
        curl -fsSL -o "$T/glab.tgz" "https://gitlab.com/gitlab-org/cli/-/releases/v${V}/downloads/glab_${V}_linux_amd64.tar.gz" # [R?]
        echo "$AFTERLIFE_GLAB_SHA256  $T/glab.tgz" | sha256sum -c -
        tar -xzf "$T/glab.tgz" -C "$T" && install "$(find "$T" -name glab -type f | head -n1)" /usr/local/bin/glab
      fi
      # The job token only, whatever this project's variables say (F4): a target pipeline never holds a write token, and
      # belay-apply (gitlab/apply) makes every write. A job token reads MRs and notes and cannot write them [S].
      unset GITLAB_TOKEN
      glab auth login --hostname "$CI_SERVER_FQDN" --job-token "$CI_JOB_TOKEN" --api-protocol "$CI_SERVER_PROTOCOL"

"belay-proof-$[[ inputs.class ]]":
  extends: .belay-boot-proof-engine
  stage: $[[ inputs.stage ]]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables: { AFTERLIFE_PHASE: pre-merge, BELAY_PHASE: pre-merge }
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
      variables: { AFTERLIFE_PHASE: post-merge, BELAY_PHASE: post-merge }
  script:
    - |
      set -eu
      mkdir -p .belay
      # The class, agent prefix, evidence mode and file and the post-merge switch are inputs, never job variables: a pipeline
      # variable outranks a job's and would steer what the report-only artifact says. Each is options- or regex-guarded.
      AFTERLIFE_CLASS='$[[ inputs.class ]]'; AFTERLIFE_AGENT_PREFIX='$[[ inputs.agent_prefix ]]'; AFTERLIFE_EVIDENCE_MODE='$[[ inputs.evidence_mode ]]'
      AFTERLIFE_EVIDENCE_FILE='$[[ inputs.evidence_file ]]'; AFTERLIFE_POST_MERGE='$[[ inputs.post_merge ]]'
      # M6: build_args, prepare_script and the trusted block authors are inputs, fixed at include time; a pipeline variable
      # cannot reach them. build_args is regex-guarded (no quote, $, ; | & or backtick), so the single quotes hold.
      AFTERLIFE_BUILD_ARGS='$[[ inputs.build_args ]]'; AFTERLIFE_BLOCK_AUTHORS="$[[ inputs.block_authors ]]"
      if [ "$AFTERLIFE_PHASE" = "post-merge" ] && [ "$AFTERLIFE_POST_MERGE" != "true" ]; then echo "post-merge proof is off"; exit 0; fi
      rc=0
      if [ "$AFTERLIFE_PHASE" = "pre-merge" ]; then
        node "$AFTERLIFE_GLUE/proof/mr-context.mjs" --mr "$CI_MERGE_REQUEST_IID" --agent-prefix "$AFTERLIFE_AGENT_PREFIX" || rc=$?
      else
        node "$AFTERLIFE_GLUE/proof/mr-context.mjs" --commit "$CI_COMMIT_SHA" --agent-prefix "$AFTERLIFE_AGENT_PREFIX" || rc=$?
      fi
      if [ "$rc" -eq 10 ]; then exit 0; fi
      if [ "$rc" -ne 0 ]; then exit "$rc"; fi
      # mr.env names each value twice, AFTERLIFE_X and BELAY_X (one deprecation window); an engine_ref pinned before the
      # rename writes only the second. All are unset first, so a pipeline variable of either name never stands in for a line.
      unset AFTERLIFE_MR_IID AFTERLIFE_TASK_ID AFTERLIFE_ACTION_CLASS AFTERLIFE_AGENT AFTERLIFE_BASE_SHA AFTERLIFE_HEAD_SHA
      unset BELAY_MR_IID BELAY_TASK_ID BELAY_ACTION_CLASS BELAY_AGENT BELAY_BASE_SHA BELAY_HEAD_SHA
      . ./.belay/mr.env
      AFTERLIFE_MR_IID="${AFTERLIFE_MR_IID:-$BELAY_MR_IID}"; AFTERLIFE_TASK_ID="${AFTERLIFE_TASK_ID:-$BELAY_TASK_ID}"
      AFTERLIFE_ACTION_CLASS="${AFTERLIFE_ACTION_CLASS:-$BELAY_ACTION_CLASS}"; AFTERLIFE_AGENT="${AFTERLIFE_AGENT:-$BELAY_AGENT}"
      AFTERLIFE_BASE_SHA="${AFTERLIFE_BASE_SHA:-$BELAY_BASE_SHA}"; AFTERLIFE_HEAD_SHA="${AFTERLIFE_HEAD_SHA:-$BELAY_HEAD_SHA}"
      if [ "$AFTERLIFE_PHASE" = "post-merge" ]; then AFTERLIFE_BASE_SHA="$CI_COMMIT_BEFORE_SHA"; AFTERLIFE_HEAD_SHA="$CI_COMMIT_SHA"; fi
      git clone -q --depth 1 --branch "$AFTERLIFE_POLICY_REF" "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_FQDN}/${AFTERLIFE_POLICY_PROJECT}.git" .belay-policy
      export AFTERLIFE_POLICY_FILE="$CI_PROJECT_DIR/.belay-policy/trust-policy.yml"
      export AFTERLIFE_DIFF_FILE="$CI_PROJECT_DIR/.belay/diff.patch"
      git diff "$AFTERLIFE_BASE_SHA" "$AFTERLIFE_HEAD_SHA" > "$AFTERLIFE_DIFF_FILE"
      export AFTERLIFE_MR_IID AFTERLIFE_TASK_ID AFTERLIFE_ACTION_CLASS AFTERLIFE_AGENT AFTERLIFE_BASE_SHA AFTERLIFE_HEAD_SHA AFTERLIFE_PHASE
      # The same values under the pre-rename names, for one deprecation window: the pinned engine and prepare_script may read them.
      export BELAY_MR_IID="$AFTERLIFE_MR_IID" BELAY_TASK_ID="$AFTERLIFE_TASK_ID" BELAY_ACTION_CLASS="$AFTERLIFE_ACTION_CLASS"
      export BELAY_AGENT="$AFTERLIFE_AGENT" BELAY_BASE_SHA="$AFTERLIFE_BASE_SHA" BELAY_HEAD_SHA="$AFTERLIFE_HEAD_SHA"
      export BELAY_PHASE="$AFTERLIFE_PHASE" BELAY_POLICY_FILE="$AFTERLIFE_POLICY_FILE" BELAY_DIFF_FILE="$AFTERLIFE_DIFF_FILE"
      # The includer's shell is the next three entries: a quoted heredoc writes it out, so nothing in it is expanded before
      # it runs. Separate entries because a block scalar cannot hold a line at column 0 for the terminator.
      cat > .belay/prepare.sh <<'AFTERLIFE_PREPARE_EOF'
    - "# prepare_script\n$[[ inputs.prepare_script ]]"
    - "AFTERLIFE_PREPARE_EOF"
    - |
      sh .belay/prepare.sh
      finish() {   # report-only: the proof is the job's artifact; exit with the engine's code
        exit "$1"   # 0 pass, 1 fail, 2 inconclusive or error: only a pass leaves the job green
      }
      EVIDENCE="$CI_PROJECT_DIR/$AFTERLIFE_EVIDENCE_FILE"
      if [ "$AFTERLIFE_EVIDENCE_MODE" = "auto" ]; then
        EVIDENCE="$CI_PROJECT_DIR/.belay/evidence.json"
        case "$AFTERLIFE_CLASS" in
          cited-diff) TAG=belay-guardrail; AUTH="${AFTERLIFE_BLOCK_AUTHORS:-ai-guardrail-$CI_PROJECT_ROOT_NAMESPACE}"; HS="--head-sha $AFTERLIFE_HEAD_SHA" ;;
          rerun-stats) TAG=belay-medic; AUTH="${AFTERLIFE_BLOCK_AUTHORS:-ai-medic-$CI_PROJECT_ROOT_NAMESPACE}"; HS="" ;;
          *) TAG=""; AUTH=""; HS="" ;;
        esac
        rc=0
        if [ -n "$TAG" ]; then
          node "$AFTERLIFE_GLUE/proof/fetch-block.mjs" --mr "$AFTERLIFE_MR_IID" --tag "$TAG" --authors "$AUTH" $HS --out .belay/verdict.json >/dev/null || rc=$?
          if [ "$rc" -ne 0 ]; then : > .belay/proof.json; finish 2; fi
        fi
        node "$AFTERLIFE_GLUE/proof/build-evidence.mjs" --class "$AFTERLIFE_CLASS" --out "$EVIDENCE" --verdict .belay/verdict.json $AFTERLIFE_BUILD_ARGS || { : > .belay/proof.json; finish 2; }
      fi
      rc=0
      (cd "$AFTERLIFE_DIR" && npx tsx engine/cli.ts prove --class "$AFTERLIFE_CLASS" --input "$EVIDENCE" --policy "$AFTERLIFE_POLICY_FILE" --files-root "$CI_PROJECT_DIR") > .belay/proof.json || rc=$?
      finish "$rc"
  artifacts:
    when: always
    expire_in: 30 days
    paths: [.belay/proof.json, .belay/mr.env, .belay/diff.patch]
