# Component: ledger-append. Appends events to belay-ledger through the engine hash chain.
# Syntax checked 2026-10-06 against:
#   spec:inputs, $[[ inputs.x ]] ........ https://docs.gitlab.com/ci/yaml/#specinputs , https://docs.gitlab.com/ci/components/ [S]
#   rules, resource_group, artifacts, needs ... https://docs.gitlab.com/ci/yaml/ [S]
#   CI_JOB_TOKEN cannot write MR notes/labels, approve or merge; it can clone an allowlisting project
#       .......................................... https://docs.gitlab.com/ci/jobs/ci_job_token/ [S]
#   glab mr note create / update / approve / merge, glab api ... https://docs.gitlab.com/cli/ [S]
# [R?] verify: arrays interpolated into `tags:` (runner_tags); the glab release asset URL in the boot step.
spec:
  inputs:
    stage:
      default: '.post'
    engine_ref:
      type: string
      description: Tag, branch or full SHA of the Belay engine to run. Required, so the checker is always pinned.
    engine_commit:
      default: ''
      description: Optional 40-char SHA the checkout must resolve to. Set it when engine_ref is a tag or branch.
    engine_project:
      default: '$CI_PROJECT_ROOT_NAMESPACE/belay-engine'
      description: Project path holding the Belay repo (engine/, src/schemas, gitlab/). Must allowlist this project's job token.
    policy_project:
      default: '$CI_PROJECT_ROOT_NAMESPACE/belay-policy'
    policy_ref:
      default: main
    node_image:
      default: 'node:22-bookworm'
    glab_version:
      default: '1.120.0'
    glab_sha256:
      default: ''
    runner_tags:
      type: array
      default: []
    ledger_project:
      default: '$CI_PROJECT_ROOT_NAMESPACE/belay-ledger'
    ledger_branch:
      default: main
    write_token_var:
      default: BELAY_BOT_TOKEN
      description: Name of the CI variable holding a token that may write belay-ledger.
---
.belay-boot-ledger-append:
  image: $[[ inputs.node_image ]]
  tags: $[[ inputs.runner_tags ]]
  variables:
    GIT_DEPTH: "0"
    BELAY_ENGINE_PROJECT: "$[[ inputs.engine_project ]]"
    BELAY_ENGINE_REF: "$[[ inputs.engine_ref ]]"
    BELAY_ENGINE_COMMIT: "$[[ inputs.engine_commit ]]"
    BELAY_POLICY_PROJECT: "$[[ inputs.policy_project ]]"
    BELAY_POLICY_REF: "$[[ inputs.policy_ref ]]"
    BELAY_GLAB_VERSION: "$[[ inputs.glab_version ]]"
    BELAY_GLAB_SHA256: "$[[ inputs.glab_sha256 ]]"
  cache:
    key: belay-engine-$[[ inputs.engine_ref ]]
    paths: [.belay-engine/node_modules/]
  before_script:
    - |
      set -eu
      HOSTURL="https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_FQDN}"
      export BELAY_DIR="$CI_PROJECT_DIR/.belay-engine"
      export BELAY_GLUE="$BELAY_DIR/gitlab/components/scripts"
      git init -q "$BELAY_DIR"
      git -C "$BELAY_DIR" fetch -q --depth 1 "$HOSTURL/${BELAY_ENGINE_PROJECT}.git" "$BELAY_ENGINE_REF"
      git -C "$BELAY_DIR" checkout -q FETCH_HEAD
      if [ -n "$BELAY_ENGINE_COMMIT" ] && [ "$(git -C "$BELAY_DIR" rev-parse HEAD)" != "$BELAY_ENGINE_COMMIT" ]; then
        echo "belay engine is at $(git -C "$BELAY_DIR" rev-parse HEAD), not the pinned $BELAY_ENGINE_COMMIT" >&2; exit 2
      fi
      (cd "$BELAY_DIR" && npm ci --ignore-scripts --no-audit --no-fund --loglevel=error)
      if ! command -v glab >/dev/null 2>&1; then
        V="$BELAY_GLAB_VERSION"; T="$(mktemp -d)"
        curl -fsSL -o "$T/glab.tgz" "https://gitlab.com/gitlab-org/cli/-/releases/v${V}/downloads/glab_${V}_linux_amd64.tar.gz" # [R?]
        if [ -n "$BELAY_GLAB_SHA256" ]; then echo "$BELAY_GLAB_SHA256  $T/glab.tgz" | sha256sum -c -; fi
        tar -xzf "$T/glab.tgz" -C "$T" && install "$(find "$T" -name glab -type f | head -n1)" /usr/local/bin/glab
      fi
      if [ -n "${BELAY_BOT_TOKEN:-}" ]; then export GITLAB_TOKEN="$BELAY_BOT_TOKEN"
      else glab auth login --hostname "$CI_SERVER_FQDN" --job-token "$CI_JOB_TOKEN" --api-protocol "$CI_SERVER_PROTOCOL"; fi

belay-ledger-append:
  extends: .belay-boot-ledger-append
  stage: $[[ inputs.stage ]]
  allow_failure: true   # an audit gap must not stop a merge decision that was already made; the failure is visible in the pipeline
  # Runs after the gate even when the gate blocked: a block is an event too.
  needs:
    - job: belay-tier-gate
      artifacts: true
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_PIPELINE_SOURCE =~ /^(api|trigger|pipeline|schedule)$/ && $BELAY_EVENT_JSON
      when: always
  resource_group: belay-ledger-$CI_PROJECT_ID
  variables:
    BELAY_LEDGER_PROJECT: "$[[ inputs.ledger_project ]]"
    BELAY_LEDGER_BRANCH: "$[[ inputs.ledger_branch ]]"
    BELAY_WRITE_TOKEN_VAR: "$[[ inputs.write_token_var ]]"
  script:
    - |
      set -eu
      mkdir -p .belay/events
      if [ -n "${BELAY_EVENT_JSON:-}" ]; then printf '%s' "$BELAY_EVENT_JSON" > .belay/events/9-from-variable.json; fi
      node "$BELAY_GLUE/decide/ledger-append.mjs" --events .belay/events --project "$BELAY_LEDGER_PROJECT" \
        --branch "$BELAY_LEDGER_BRANCH" --write-token-var "$BELAY_WRITE_TOKEN_VAR"
