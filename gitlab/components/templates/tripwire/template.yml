# Component: tripwire. Demotes on revert, reopened finding, post-merge proof fail, red default branch, guardrail high. Commits tier-state.yml to belay-policy.
# Syntax checked 2026-10-06 against:
#   spec:inputs, $[[ inputs.x ]] ........ https://docs.gitlab.com/ci/yaml/#specinputs , https://docs.gitlab.com/ci/components/ [S]
#   rules, resource_group, artifacts, needs ... https://docs.gitlab.com/ci/yaml/ [S]
#   CI_JOB_TOKEN cannot write MR notes/labels, approve or merge; it can clone an allowlisting project
#       .......................................... https://docs.gitlab.com/ci/jobs/ci_job_token/ [S]
#   glab mr note create / update / approve / merge, glab api ... https://docs.gitlab.com/cli/ [S]
# [R?] verify: arrays interpolated into `tags:` (runner_tags); the glab release asset URL in the boot step.
spec:
  inputs:
    stage:
      default: '.post'
    engine_ref:
      type: string
      description: Tag, branch or full SHA of the Belay engine to run. Required, so the checker is always pinned.
    engine_commit:
      default: ''
      description: Optional 40-char SHA the checkout must resolve to. Set it when engine_ref is a tag or branch.
    engine_project:
      default: '$CI_PROJECT_ROOT_NAMESPACE/belay-engine'
      description: Project path holding the Belay repo (engine/, src/schemas, gitlab/). Must allowlist this project's job token.
    policy_project:
      default: '$CI_PROJECT_ROOT_NAMESPACE/belay-policy'
    policy_ref:
      default: main
    node_image:
      default: 'node:22-bookworm'
    glab_version:
      default: '1.120.0'
    glab_sha256:
      default: ''
    runner_tags:
      type: array
      default: []
    guardrail_authors:
      default: 'ai-guardrail-$CI_PROJECT_ROOT_NAMESPACE'
      description: Usernames whose guardrail notes count (a high-severity block demotes the agent).
    agent_prefix:
      default: 'ai-'
    lookback_hours:
      type: number
      default: 24
      description: How far back a sweep looks. Events already recorded in belay-policy history are skipped.
    write_mode:
      default: commit
      options: [commit, mr]
      description: commit pushes tier-state.yml to the policy branch (the bot must be allowed to push, spike S8). mr opens a merge request instead.
    policy_branch:
      default: main
    write_token_var:
      default: BELAY_POLICY_TOKEN
      description: Name of the CI variable (protected, masked) holding a token that may write belay-policy.
---
.belay-boot-tripwire:
  image: $[[ inputs.node_image ]]
  tags: $[[ inputs.runner_tags ]]
  variables:
    GIT_DEPTH: "0"
    BELAY_ENGINE_PROJECT: "$[[ inputs.engine_project ]]"
    BELAY_ENGINE_REF: "$[[ inputs.engine_ref ]]"
    BELAY_ENGINE_COMMIT: "$[[ inputs.engine_commit ]]"
    BELAY_POLICY_PROJECT: "$[[ inputs.policy_project ]]"
    BELAY_POLICY_REF: "$[[ inputs.policy_ref ]]"
    BELAY_GLAB_VERSION: "$[[ inputs.glab_version ]]"
    BELAY_GLAB_SHA256: "$[[ inputs.glab_sha256 ]]"
  cache:
    key: belay-engine-$[[ inputs.engine_ref ]]
    paths: [.belay-engine/node_modules/]
  before_script:
    - |
      set -eu
      HOSTURL="https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_FQDN}"
      export BELAY_DIR="$CI_PROJECT_DIR/.belay-engine"
      export BELAY_GLUE="$BELAY_DIR/gitlab/components/scripts"
      git init -q "$BELAY_DIR"
      git -C "$BELAY_DIR" fetch -q --depth 1 "$HOSTURL/${BELAY_ENGINE_PROJECT}.git" "$BELAY_ENGINE_REF"
      git -C "$BELAY_DIR" checkout -q FETCH_HEAD
      if [ -n "$BELAY_ENGINE_COMMIT" ] && [ "$(git -C "$BELAY_DIR" rev-parse HEAD)" != "$BELAY_ENGINE_COMMIT" ]; then
        echo "belay engine is at $(git -C "$BELAY_DIR" rev-parse HEAD), not the pinned $BELAY_ENGINE_COMMIT" >&2; exit 2
      fi
      (cd "$BELAY_DIR" && npm ci --ignore-scripts --no-audit --no-fund --loglevel=error)
      if ! command -v glab >/dev/null 2>&1; then
        V="$BELAY_GLAB_VERSION"; T="$(mktemp -d)"
        curl -fsSL -o "$T/glab.tgz" "https://gitlab.com/gitlab-org/cli/-/releases/v${V}/downloads/glab_${V}_linux_amd64.tar.gz" # [R?]
        if [ -n "$BELAY_GLAB_SHA256" ]; then echo "$BELAY_GLAB_SHA256  $T/glab.tgz" | sha256sum -c -; fi
        tar -xzf "$T/glab.tgz" -C "$T" && install "$(find "$T" -name glab -type f | head -n1)" /usr/local/bin/glab
      fi
      if [ -n "${BELAY_BOT_TOKEN:-}" ]; then export GITLAB_TOKEN="$BELAY_BOT_TOKEN"
      else glab auth login --hostname "$CI_SERVER_FQDN" --job-token "$CI_JOB_TOKEN" --api-protocol "$CI_SERVER_PROTOCOL"; fi

belay-tripwire:
  extends: .belay-boot-tripwire
  stage: $[[ inputs.stage ]]
  resource_group: belay-tripwire
  # Default-branch and schedule pipelines only: the write token is a protected variable and is never given to MR branches.
  # when: always, because a failed belay-proof-<class> is what this job must see: on_success (the default) skipped the
  # .post job exactly when the post-merge proof failed. Same job, same pipelines, same tokens: no MR pipeline matches.
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $BELAY_TRIPWIRE == "sweep"
      variables: { BELAY_MODE: sweep }
      when: always
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables: { BELAY_MODE: event }
      when: always
  variables:
    BELAY_GUARDRAIL_AUTHORS: "$[[ inputs.guardrail_authors ]]"
    BELAY_AGENT_PREFIX: "$[[ inputs.agent_prefix ]]"
    BELAY_LOOKBACK: "$[[ inputs.lookback_hours ]]"
    BELAY_WRITE_MODE: "$[[ inputs.write_mode ]]"
    BELAY_POLICY_BRANCH: "$[[ inputs.policy_branch ]]"
    BELAY_WRITE_TOKEN_VAR: "$[[ inputs.write_token_var ]]"
  script:
    - |
      set -eu
      if [ -z "${BELAY_BOT_TOKEN:-}" ]; then echo "tripwire needs BELAY_BOT_TOKEN (read the target project) and $BELAY_WRITE_TOKEN_VAR (write belay-policy)" >&2; exit 2; fi
      git clone -q --depth 300 --branch "$BELAY_POLICY_REF" "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_FQDN}/${BELAY_POLICY_PROJECT}.git" .belay-policy
      node "$BELAY_GLUE/decide/tripwire.mjs" --mode "$BELAY_MODE" --policy-dir .belay-policy --policy-project "$BELAY_POLICY_PROJECT" \
        --policy-branch "$BELAY_POLICY_BRANCH" --guardrail-authors "$BELAY_GUARDRAIL_AUTHORS" --agent-prefix "$BELAY_AGENT_PREFIX" \
        --lookback-hours "$BELAY_LOOKBACK" --write-mode "$BELAY_WRITE_MODE" --write-token-var "$BELAY_WRITE_TOKEN_VAR"
