# Copy to .afterlife/fleet.yml (gitignored; an existing .belay/fleet.yml is still read) and point `path` at your checkouts.
# Each gate is its own command, run in the lane worktree, exit code asserted; all green or nothing commits.
# `setup` runs in every fresh worktree first (a worktree has no node_modules or venv). Prefer real installs
# over junctions into the main checkout: removing a worktree must never reach the main checkout's files.
# A lane may run (Bash) the command prefixes of its repo's setup and gates - `uv run ruff`, `cargo fmt`, `npm run
# typecheck` - plus any `laneTools` prefixes listed here (cheap targeted checks); never git or the network.
# Gates below come from each repo's .claude/scan-sweep/config.md / AGENTS.md / .ai/manifest.yaml.
#
# `gitlab` (optional, per repo): the repo's GitLab path_with_namespace (group/sub/project). The runner ignores it;
# Fleet and Monitor read it to put the repo's agent spend on its Fleet project. Without it the slug must equal the
# project's Fleet id; a repo matched by neither is listed "not in Fleet" on the runner strip, never dropped.
#
# `frontier` (optional, per repo; none is set below - the operator picks objectives and metrics): when the plan
# fills fewer lanes than asked, the wave runs ONE frontier lane on the objective (prompts/frontier.md), through the
# same review, repair and gates. When the wave lands anything, each metric is measured on the wave base (twice) and
# on its tip (once or twice) in a throwaway worktree with `setup` run in it, and recorded as `wave.tech`. A metric:
# name, command (null = read what the previous command left), parse ({kind: wall, unit?} = the command's wall time,
# {kind: json-sum, file, field, scale?, unit?} = sum of `field` over a JSON file's values, {kind: regex, pattern,
# unit?} = the first capture group of stdout+stderr), direction (up|down), threshold (a fraction: the gain that is a
# breakthrough, and the spread at which a metric is noisy), timeoutMin (default 20). Measure a wall time only with a
# threshold above its noise; a deterministic metric (bytes, counts) is the dependable one. For example:
#
#   frontier:
#     objective: |
#       Cut the client bundle: first-load JS of the app routes, today ~410 kB (lower is better). Past the edge:
#       code splitting, lazy routes, dropping duplicated dependencies.
#     metrics:
#       - name: build
#         command: npm run build
#         parse: {kind: wall, unit: s}
#         direction: down
#         threshold: 0.25
#         timeoutMin: 15
#       - name: first-load js
#         command: null
#         parse: {kind: json-sum, file: .next/analyze/client.json, field: parsedSize, scale: 0.001, unit: kB}
#         direction: down
#         threshold: 0.05
#       - name: unit tests
#         command: npx vitest run
#         parse: {kind: regex, pattern: "Tests\\s+(\\d+) passed", unit: tests}
#         direction: up
#         threshold: 0.05
repos:
  - slug: athena-portable
    path: /path/to/athena-portable
    gitlab: your-group/athena-portable
    base: main
    diffCheck: true
    laneCapUsd: 3
    waveCapUsd: 25
    setup:
      - uv sync --extra dev
      - pnpm install --frozen-lockfile --prefer-offline
    laneTools:
      # vitest and tsc are not root dependencies: a lane checks one package (`pnpm --filter <pkg> test`).
      - pnpm --filter
    gates:
      - uv run ruff check .
      - uv run ruff format --check .
      - uv run mypy
      - uv run pytest -m "not provider and not eval"
      - pnpm typecheck && pnpm lint && pnpm test
      # CI-adjacent suites the three above skip: the desktop panel against a real daemon (was red 5/33 unseen),
      # and hirelane design:check. The src-tauri cargo trio needs a desktop build first and is left out.
      - pnpm --filter athena-desktop test:e2e
      - pnpm --filter hirelane design:check
  - slug: paypal
    path: /path/to/paypal
    base: main
    setup:
      - pnpm --dir apps/desktop/client install --frozen-lockfile --prefer-offline
    laneTools:
      - cargo check
      - pnpm --dir
    gates:
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets -- -D warnings
      - cargo test --workspace
      # CI also runs these; cargo deny was red on main (RUSTSEC-2026-0381/0382) while only the cargo gates ran.
      - cargo deny check
      - pnpm --dir apps/desktop/client typecheck
      - pnpm --dir apps/desktop/client test
  - slug: gravitone-gcloud
    path: /path/to/gravitone-gcloud
    base: main
    diffCheck: true
    setup:
      - npm ci --prefer-offline --no-audit --no-fund
    laneTools:
      - npx vitest run
      - npx tsc --noEmit
      - npx playwright test
      - npx eslint
    gates:
      - npm run typecheck
      - npm run lint:ratchet
      - npm test
      # npm test is Playwright only; the repo verify also runs vitest (about 70s).
      - npx vitest run
