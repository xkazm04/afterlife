# Afterlife's own pipeline: verify the code, scan it, build it, and show the model-free proof engine at work.
#   verify  - install once per job from the npm cache; typecheck, lint, repo structure rules, the Vitest suite (three tiers)
#   secure  - GitLab SAST (Semgrep) and Secret Detection, both on the free tier. Dependency Scanning is Ultimate-only, so
#             `npm audit` stands in for it (report-only).
#   package - `next build` (standalone output) and the Cloud Run image from infra/cloudrun/Dockerfile
#   prove   - the proof engine re-derives every proof class from the committed evidence fixtures with no AI model, no
#             network and no token: an honest claim must come out `pass`, a fabricated / weakened / regressed one `fail`.
#             Then it reads this very checkout (`scan --dir .`) and prints its own pin.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages: [verify, test, secure, package, prove]

variables:
  NODE_IMAGE: node:24-bookworm
  npm_config_cache: $CI_PROJECT_DIR/.npm
  NEXT_TELEMETRY_DISABLED: "1"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  FF_USE_FASTZIP: "true"

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

.node:
  image: $NODE_IMAGE
  interruptible: true
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
    policy: pull-push
  before_script:
    - node --version && npm --version
    # The committed lock misses @emnapi/runtime and @emnapi/core (needed by the optional @img/sharp-wasm32), so a Linux
    # `npm ci` refuses it. Same fix as infra/cloudrun/Dockerfile: fill in only the missing entries, then install that lock.
    - npm install --package-lock-only --no-audit --no-fund --prefer-offline
    - npm ci --no-audit --no-fund --prefer-offline

# ---------------------------------------------------------------- verify
typecheck:
  extends: .node
  stage: verify
  script:
    - npm run typecheck

lint:
  extends: .node
  stage: verify
  script:
    - npm run lint

structure:
  extends: .node
  stage: verify
  cache: []
  before_script: []
  script:
    # Files at most 200 lines, folders at most 10 files (scripts/check-structure.mjs); needs no dependencies.
    - npm run check:structure

# The suite split by its own tiers (scripts/test/tiers.mjs): `unit`, `db` (embedded Postgres, ~1 GB a worker), `spawn`.
.vitest:
  extends: .node
  stage: verify
  variables:
    GIT_DEPTH: "0" # some tests read the repo's own history
  script:
    - node scripts/test/run.mjs --project "$TIER" --maxWorkers=2 --reporter=default --reporter=junit --outputFile.junit="junit-$TIER.xml"
  artifacts:
    when: always
    reports:
      junit: junit-$TIER.xml

test:unit:
  extends: .vitest
  variables: { TIER: unit }

test:db:
  extends: .vitest
  variables: { TIER: db }

test:spawn:
  extends: .vitest
  variables: { TIER: spawn }

# ---------------------------------------------------------------- secure
semgrep-sast:
  stage: secure
  needs: []

secret_detection:
  stage: secure
  needs: []

npm-audit:
  image: $NODE_IMAGE
  stage: secure
  needs: []
  allow_failure: true
  script:
    - npm audit --omit=dev --audit-level=high

# ---------------------------------------------------------------- package
next-build:
  extends: .node
  stage: package
  needs: [typecheck]
  script:
    - npm run build
    - du -sh .next/standalone
  artifacts:
    expire_in: 3 days
    paths: [.next/standalone/server.js]

cloudrun-image:
  stage: package
  needs: []
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -f infra/cloudrun/Dockerfile -t afterlife-replay:$CI_COMMIT_SHORT_SHA .
    - docker image ls afterlife-replay
    # Boot the replay and ask it for the home page: the image starts, serves, and runs as the node user.
    - docker run -d --name replay -p 8080:8080 afterlife-replay:$CI_COMMIT_SHORT_SHA
    - for i in $(seq 1 30); do wget -qO- http://docker:8080/ >/dev/null && break; sleep 2; done
    - wget -qS -O /dev/null http://docker:8080/
    - test "$(docker exec replay whoami)" = node

# ---------------------------------------------------------------- prove
proof-engine:
  extends: .node
  stage: prove
  needs: []
  script:
    - mkdir -p proofs
    - |
      F=engine/__fixtures__; failed=0
      # expect <exit code> <class> <input>: run the engine and require the exit it must give (0 pass, 1 fail, 2 inconclusive)
      expect() {
        want=$1; cls=$2; in=$3; out="proofs/$cls.$(basename "$in" .json).json"
        set +e; npx tsx engine/cli.ts prove --class "$cls" --input "$in" > "$out" 2> proofs/stderr.txt; got=$?; set -e
        verdict=$(node -e 'try{const b=JSON.parse(require("fs").readFileSync(process.argv[1]));console.log(b.verdict??b.error)}catch{console.log("?")}' "$out")
        if [ "$got" = "$want" ]; then mark=OK; else mark=WRONG; failed=1; fi
        printf '%-6s %-16s %-28s exit %s (want %s)  verdict=%s\n' "$mark" "$cls" "$(basename "$in")" "$got" "$want" "$verdict"
      }
      echo "== honest evidence: the engine must re-derive a pass =="
      expect 0 exploit-test    $F/exploit/input.pass.json
      expect 0 cited-diff      $F/cited/input.grounded.json
      expect 0 rerun-stats     $F/rerun/flake.json
      expect 0 linked-evidence $F/linked/input.json
      expect 0 repro           $F/repro/input.pass.json
      expect 0 bench-delta     $F/bench/input.pass.json
      expect 0 score-delta     $F/score/input.pass.json
      expect 0 ledger-record   $F/ledger/input.json
      echo "== dishonest or broken evidence: the engine must refuse it =="
      expect 1 exploit-test    $F/exploit/input.weakened.json   # the fix weakened a test
      expect 1 exploit-test    $F/exploit/input.trace.json      # diff outside the class envelope
      expect 1 cited-diff      $F/cited/input.fabricated.json   # quotes text that is not in the diff
      expect 1 rerun-stats     $F/rerun/real.json               # a real failure claimed as a flake
      expect 1 linked-evidence $F/linked/input.broken.json      # a link that does not resolve
      expect 1 repro           $F/repro/input.stray.json        # runs against another sha
      expect 1 bench-delta     $F/bench/input.regressed.json    # a benchmark got slower
      expect 1 score-delta     $F/score/input.regressed.json    # a maturity stage went down
      expect 2 ledger-record   $F/ledger/input.trial.json       # trial short of its minimum: inconclusive, never a pass
      exit $failed
    - echo "== Day-0 maturity read of this checkout (engine scan, read-only) =="
    - npx tsx engine/cli.ts scan --dir . --propose > proofs/maturity.json
    - echo "== engine pin carried by every Proof Block =="
    - npx tsx engine/cli.ts pin | tee proofs/pin.json | head -5
  artifacts:
    when: always
    expire_in: 30 days
    paths: [proofs/]
